---
name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The coverage stage rests on this script's failure paths, which no Docker-backed job exercises.
  check-junit:
    name: check_junit.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 test_check_junit.py

  quibble:
    name: phpunit-unit on BoilerPlate
    runs-on: ubuntu-latest
    steps:
      # Check the action out at the workspace root so it can be used as `uses: ./`,
      # and the real minimal extension under test (BoilerPlate) into a subdirectory
      # pointed at by the action's `project-path` input.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wikimedia/mediawiki-extensions-BoilerPlate
          ref: REL1_46
          path: project
          persist-credentials: false
      - id: quibble
        uses: ./
        with:
          stage: phpunit-unit
          mediawiki-version: REL1_46
          project-path: project
          upload-logs: true
          dump-db: true
          phpunit-junit: true
      # Neither input is observable anywhere but the log directory.
      - name: Assert the dump and the JUnit report were written
        env:
          LOG_DIR: ${{ steps.quibble.outputs.logs }}
        run: |
          test -s "$LOG_DIR/mysqldump.sql"
          test -s "$LOG_DIR/junit-unit.xml"

  quibble-sqlite:
    name: phpunit-unit on BoilerPlate (sqlite)
    runs-on: ubuntu-latest
    steps:
      # Same run as the job above on the non-default database backend, so that
      # the db input is exercised rather than only declared.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wikimedia/mediawiki-extensions-BoilerPlate
          ref: REL1_46
          path: project
          persist-credentials: false
      - uses: ./
        with:
          stage: phpunit-unit
          mediawiki-version: REL1_46
          project-path: project
          db: sqlite

  quibble-vendor:
    name: phpunit-unit on BoilerPlate (vendor)
    runs-on: ubuntu-latest
    steps:
      # Same run as the job above installing core's dependencies from the
      # mediawiki/vendor repository, so the packages-source input is exercised
      # rather than only declared.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wikimedia/mediawiki-extensions-BoilerPlate
          ref: REL1_46
          path: project
          persist-credentials: false
      - uses: ./
        with:
          stage: phpunit-unit
          mediawiki-version: REL1_46
          project-path: project
          packages-source: vendor

  phan:
    name: phan on BoilerPlate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wikimedia/mediawiki-extensions-BoilerPlate
          ref: REL1_46
          path: project
          persist-credentials: false
      - uses: ./
        with:
          stage: phan
          mediawiki-version: REL1_46
          project-path: project

  composer-test:
    name: composer-test on BoilerPlate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wikimedia/mediawiki-extensions-BoilerPlate
          ref: REL1_46
          path: project
          persist-credentials: false
      - uses: ./
        with:
          stage: composer-test
          mediawiki-version: REL1_46
          project-path: project

  coverage:
    name: coverage on BoilerPlate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Coverage requires the master MediaWiki branch (that is where MediaWiki's
      # coverage tooling lives), so test BoilerPlate's master branch against it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wikimedia/mediawiki-extensions-BoilerPlate
          ref: master
          path: project
          persist-credentials: false
      - id: quibble
        uses: ./
        with:
          stage: coverage
          mediawiki-version: master
          project-path: project
          # The coverage command is PHPUnit only, so this job doubles as the
          # proof that the run does not need the npm install it skips.
          skip-npm-install: true
      # Assert the coverage stage produced a report (the cover dir is non-empty).
      - name: Assert a coverage report was produced
        env:
          COVER_DIR: ${{ steps.quibble.outputs.coverage }}
        run: |
          ls -la "$COVER_DIR"
          test -n "$(ls -A "$COVER_DIR" 2>/dev/null)"
