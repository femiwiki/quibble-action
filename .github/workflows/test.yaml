---
name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The coverage stage rests on this script's failure paths, which no Docker-backed job exercises.
  check-junit:
    name: check_junit.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 test_check_junit.py

  resolve-dependencies:
    name: resolve_dependencies.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 test_resolve_dependencies.py

  quibble:
    name: phpunit-unit on BoilerPlate
    runs-on: ubuntu-latest
    steps:
      # Check the action out at the workspace root so it can be used as `uses: ./`,
      # and the real minimal extension under test (BoilerPlate) into a subdirectory
      # pointed at by the action's `project-path` input.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wikimedia/mediawiki-extensions-BoilerPlate
          ref: REL1_46
          path: project
          persist-credentials: false
      - id: quibble
        uses: ./
        with:
          stage: phpunit-unit
          mediawiki-version: REL1_46
          project-path: project
          upload-logs: true
          dump-db: true
          phpunit-junit: true
      # Neither input is observable anywhere but the log directory.
      - name: Assert the dump and the JUnit report were written
        env:
          LOG_DIR: ${{ steps.quibble.outputs.logs }}
        run: |
          test -s "$LOG_DIR/mysqldump.sql"
          test -s "$LOG_DIR/junit-unit.xml"

  quibble-sqlite:
    name: phpunit-unit on BoilerPlate (sqlite)
    runs-on: ubuntu-latest
    steps:
      # Same run as the job above on the non-default database backend, so that
      # the db input is exercised rather than only declared.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wikimedia/mediawiki-extensions-BoilerPlate
          ref: REL1_46
          path: project
          persist-credentials: false
      - uses: ./
        with:
          stage: phpunit-unit
          mediawiki-version: REL1_46
          project-path: project
          db: sqlite

  quibble-vendor:
    name: phpunit-unit on BoilerPlate (vendor)
    runs-on: ubuntu-latest
    steps:
      # Same run as the job above installing core's dependencies from the
      # mediawiki/vendor repository, so the packages-source input is exercised
      # rather than only declared.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wikimedia/mediawiki-extensions-BoilerPlate
          ref: REL1_46
          path: project
          persist-credentials: false
      - uses: ./
        with:
          stage: phpunit-unit
          mediawiki-version: REL1_46
          project-path: project
          packages-source: vendor

  quibble-skin:
    name: phpunit-unit on Example
    runs-on: ubuntu-latest
    steps:
      # The same stage against a skin, which is what reaches skin.json
      # detection in the setup step and the src/skins/ placement in "Prepare
      # directories". Example rather than a larger skin: those two paths do not
      # care how much code the skin has, and it keeps the job cheap.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wikimedia/mediawiki-skins-Example
          ref: REL1_46
          path: project
          persist-credentials: false
      - uses: ./
        with:
          stage: phpunit-unit
          mediawiki-version: REL1_46
          project-path: project

  phan:
    name: phan on BoilerPlate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wikimedia/mediawiki-extensions-BoilerPlate
          ref: REL1_46
          path: project
          persist-credentials: false
      - uses: ./
        with:
          stage: phan
          mediawiki-version: REL1_46
          project-path: project

  composer-test:
    name: composer-test on BoilerPlate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wikimedia/mediawiki-extensions-BoilerPlate
          ref: REL1_46
          path: project
          persist-credentials: false
      - uses: ./
        with:
          stage: composer-test
          mediawiki-version: REL1_46
          project-path: project

  coverage:
    name: coverage on BoilerPlate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Coverage requires the master MediaWiki branch (that is where MediaWiki's
      # coverage tooling lives), so test BoilerPlate's master branch against it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wikimedia/mediawiki-extensions-BoilerPlate
          ref: master
          path: project
          persist-credentials: false
      - id: quibble
        uses: ./
        with:
          stage: coverage
          mediawiki-version: master
          project-path: project
          # The coverage command is PHPUnit only, so this job doubles as the
          # proof that the run does not need the npm install it skips.
          skip-npm-install: true
      # Assert the coverage stage produced a report (the cover dir is non-empty).
      - name: Assert a coverage report was produced
        env:
          COVER_DIR: ${{ steps.quibble.outputs.coverage }}
        run: |
          ls -la "$COVER_DIR"
          test -n "$(ls -A "$COVER_DIR" 2>/dev/null)"

  coverage-skin:
    name: coverage on MinervaNeue
    runs-on: ubuntu-latest
    steps:
      # The same stage against a skin, the half of the coverage path that used
      # to call a command no image provides. MinervaNeue rather than Vector:
      # the action clones Vector into src/skins/Vector for every run, so a
      # Vector checkout as the project under test would be copied into that
      # directory instead of over it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wikimedia/mediawiki-skins-MinervaNeue
          ref: master
          path: project
          persist-credentials: false
      - id: quibble
        uses: ./
        with:
          stage: coverage
          mediawiki-version: master
          project-path: project
          # MinervaNeue declares no requires, so dependencies come from its
          # phan config: Vector and MobileFrontend. Vector has to go, because
          # the action clones it into src/skins/Vector for every run and the
          # dependency loop then fails on the directory already being there
          # (#81). MobileFrontend stays, even though no phpunit test here
          # references it: excluding both would empty the dependency list, and
          # the exclusion loop dies on an empty result (#82).
          exclude-dependencies: Vector
      - name: Assert a coverage report was produced
        env:
          COVER_DIR: ${{ steps.quibble.outputs.coverage }}
        run: |
          ls -la "$COVER_DIR"
          test -n "$(ls -A "$COVER_DIR" 2>/dev/null)"
